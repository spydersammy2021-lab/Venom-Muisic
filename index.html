<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>VENOM PRO STYLE - REWIR OSTATECZNY</title>
    <style>
        body { 
            background: #0d001a; 
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .glass-overlay {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 40px;
            margin: 20px;
            width: 90%;
            max-width: 1200px;
            box-shadow: 0 0 50px rgba(204, 51, 255, 0.2);
            text-align: center;
        }

        .timer-pro {
            font-size: 5em;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 20px;
        }

        .grid-rewir {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .card-glass {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.4s ease-out;
        }

        .card-glass:hover {
            transform: scale(1.05);
            border-color: #ff00ff;
            background: rgba(255, 255, 255, 0.15);
        }

        .card-glass img {
            width: 100%;
            border-radius: 12px;
            display: block; /* Naprawa znikania obrazków */
        }

        .btn-bass {
            display: block;
            margin-top: 15px;
            padding: 10px;
            background: rgba(204, 51, 255, 0.5);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.8em;
        }
    </style>
</head>
<body>

    <div class="glass-overlay">
        <h1 style="letter-spacing: 8px; color: #cc33ff;">VENOM PRO STYLE</h1>
        <div class="timer-pro" id="countdown-pro">01:02:00</div>
        <p style="text-transform: uppercase;">Do Premiery Majówki (15:00) | System Error Fixed</p>

        <div class="grid-rewir">
            <div class="card-glass"><img src="https://img.youtube.com/vi/gSpok6Q0RWs/mqdefault.jpg"><a href="https://www.youtube.com/watch?v=gSpok6Q0RWs" class="btn-bass">ODTWÓRZ</a></div>
            <div class="card-glass"><img src="https://img.youtube.com/vi/-IzNeAIuCrw/mqdefault.jpg"><a href="https://www.youtube.com/watch?v=-IzNeAIuCrw" class="btn-bass">ODTWÓRZ</a></div>
            <div class="card-glass"><img src="https://img.youtube.com/vi/-gHnSUXqsg8/mqdefault.jpg"><a href="https://www.youtube.com/watch?v=-gHnSUXqsg8" class="btn-bass">ODTWÓRZ</a></div>
            <div class="card-glass"><img src="https://img.youtube.com/vi/q2asCfNW5NA/mqdefault.jpg"><a href="https://www.youtube.com/watch?v=q2asCfNW5NA" class="btn-bass">ODTWÓRZ</a></div>
            <div class="card-glass"><img src="https://img.youtube.com/vi/ObCippy-rqY/mqdefault.jpg"><a href="https://www.youtube.com/watch?v=ObCippy-rqY" class="btn-bass">ODTWÓRZ</a></div>
            <div class="card-glass"><img src="https://img.youtube.com/vi/1S4XmpBypIM/mqdefault.jpg"><a href="https://www.youtube.com/watch?v=1S4XmpBypIM" class="btn-bass">ODTWÓRZ</a></div>
            <div class="card-glass"><img src="https://img.youtube.com/vi/bibcCbi8OPw/mqdefault.jpg"><a href="https://www.youtube.com/watch?v=bibcCbi8OPw" class="btn-bass">ODTWÓRZ</a></div>
            <div class="card-glass"><img src="https://img.youtube.com/vi/dBC1uD-Tkp0/mqdefault.jpg"><a href="https://www.youtube.com/watch?v=dBC1uD-Tkp0" class="btn-bass">ODTWÓRZ</a></div>
        </div>
    </div>

    <script>
        function update() {
            const target = new Date(); target.setHours(15,0,0,0);
            const diff = target - new Date();
            if (diff <= 0) { document.getElementById('countdown-pro').innerHTML = "BOOM!"; return; }
            const h = Math.floor(diff/3600000);
            const m = Math.floor((diff/60000)%60);
            const s = Math.floor((diff/1000)%60);
            const p = (n) => n < 10 ? '0'+n : n;
            document.getElementById('countdown-pro').innerHTML = p(h)+":"+p(m)+":"+p(s);
        }
        setInterval(update, 1000); update();
    </script>
</body>
</html>
